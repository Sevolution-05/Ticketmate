<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ticketmate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --rose: #f7cac9;
  --rose-t: #fdf0ef;
  --ser: #92a8d1;
  --ser-d: #5b73a8;
  --ser-k: #34456f;
  --acc: #bf4f4c;
  --bg: #fbf6f6;
  --bd: #e7dce0;
  --tx: #2a3350;
  --body: #5e6580;
  --mut: #8a8fa6;
  --w: #fff;
  --font: "Montserrat", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
}
html {
  scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px));
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font: 500 15px/1.6 var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a,
button,
input,
select {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--ser-d);
  outline-offset: 2px;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 16px;
  padding: 12px 24px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--w);
  border-bottom: 1px solid var(--bd);
  flex-wrap: nowrap;
}
.logo {
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ser-k);
}
.logo i {
  font-style: normal;
  color: var(--acc);
}
nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  min-width: 0;
  margin: 0 auto;
}
nav a {
  padding: 8px 12px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  white-space: nowrap;
  transition: 0.2s;
}
nav a:hover {
  color: var(--ser-k);
  background: var(--rose-t);
}
nav a.on {
  background: var(--ser-d);
  color: var(--w);
}
.right {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-shrink: 0;
}
.lang {
  display: flex;
  border: 1.5px solid var(--bd);
  border-radius: 8px;
  overflow: hidden;
}
.lang button {
  border: 0;
  background: none;
  padding: 6px 10px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  color: var(--body);
}
.lang button[aria-pressed="true"] {
  background: var(--rose);
  color: var(--ser-k);
}
@media (max-width: 1560px) {
  header {
    flex-wrap: wrap;
    row-gap: 8px;
  }
  .brand {
    flex: 0 0 100%;
  }
  nav {
    order: 2;
    flex: 1 1 0;
    margin: 0;
  }
  .right {
    order: 3;
    margin-left: auto;
  }
}
@media (max-width: 700px) {
  .brand {
    flex: 0 1 auto;
  }
  nav {
    order: 3;
    flex: 0 0 100%;
  }
  .right {
    order: 2;
  }
}
main {
  flex: 1 1 0;
  min-width: 0;
  max-width: 1040px;
  margin: 0 auto;
  padding: 32px 24px 72px;
}
.page {
  display: none;
}
.page.on {
  display: block;
}
h1 {
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.022em;
  margin: 0;
  color: var(--w);
}
h2 {
  font-size: clamp(22px, 3vw, 32px);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  color: var(--tx);
}
h3 {
  color: var(--tx);
  font-weight: 700;
}
.sub {
  margin: 0 0 28px;
  max-width: 62ch;
}
.btn {
  border: 0;
  cursor: pointer;
  border-radius: 8px;
  padding: 10px 20px;
  font-weight: 600;
  font-size: 14px;
  background: var(--ser-d);
  color: var(--w);
  transition: 0.2s;
}
.btn:hover {
  background: var(--ser-k);
}
.btn.ghost {
  background: transparent;
  border: 1.5px solid var(--ser);
  color: var(--ser-d);
}
.btn.ghost:hover {
  background: var(--rose-t);
}
.btn.ghost.on {
  background: var(--rose-t);
  border-color: var(--ser-d);
  color: var(--ser-k);
}
.btn.rose {
  background: var(--rose);
  color: var(--ser-k);
}
.btn.rose:hover {
  background: var(--rose-t);
}
.btn.acc {
  background: var(--acc);
}
.btn.acc:hover {
  filter: brightness(0.92);
  background: var(--acc);
}
.btn.light {
  background: transparent;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
}
.hero {
  background: linear-gradient(135deg, var(--ser-k), var(--ser-d));
  color: var(--w);
  border-radius: 12px;
  padding: clamp(24px, 4vw, 44px);
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 28px;
  align-items: center;
  margin-bottom: 40px;
}
@media (max-width: 860px) {
  .hero {
    grid-template-columns: 1fr;
  }
}
.search {
  display: flex;
  gap: 8px;
  background: var(--w);
  border-radius: 8px;
  padding: 6px 6px 6px 16px;
  max-width: 520px;
  margin-top: 22px;
  border: 2px solid transparent;
}
.search:focus-within {
  border-color: var(--rose);
}
.search input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  color: var(--tx);
}
.spot {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 10px;
  padding: 22px;
}
.spot-k {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rose);
}
.spot-name {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
  margin: 8px 0 2px;
}
.spot-m {
  font-size: 13px;
  opacity: 0.85;
  margin: 0;
}
.nums {
  display: flex;
  gap: 24px;
  margin: 20px 0;
}
.nums div {
  display: flex;
  flex-direction: column;
}
.nums b {
  font-size: clamp(40px, 6vw, 56px);
  line-height: 1;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.nums span {
  font-size: 12px;
  color: var(--rose);
  margin-top: 8px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}
.card {
  background: var(--w);
  border: 1px solid var(--bd);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.card.go {
  cursor: pointer;
  transition: 0.2s;
}
.card.go:hover {
  box-shadow: 0 8px 24px rgba(91, 115, 168, 0.2);
  transform: translateY(-2px);
}
.cover {
  height: 180px;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 16px;
  color: var(--w);
}
.c1 {
  background: linear-gradient(135deg, #34456f, #92a8d1);
}
.c2 {
  background: linear-gradient(135deg, #92a8d1, #f7cac9);
}
.c3 {
  background: linear-gradient(135deg, #bf4f4c, #f7cac9);
}
.c4 {
  background: linear-gradient(135deg, #2a3350, #5b73a8);
}
.c5 {
  background: linear-gradient(135deg, #f7cac9, #92a8d1);
}
.img-c1 {
  background: #1b1440 var(--img-c1) center/contain no-repeat;
}
.img-c3 {
  background: #3a0d05 var(--img-c3) center/cover no-repeat;
}
.nm {
  font-weight: 700;
  font-size: 26px;
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
}
.st {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 2;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
  background: var(--w);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
}
.st.soon {
  color: var(--ser-k);
  background: var(--rose);
}
.st.few {
  color: #8a4a00;
  background: #ffe7bf;
}
.st.sold {
  color: var(--w);
  background: var(--acc);
}
.body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}
.body h3 {
  margin: 0;
  font-size: 17px;
  line-height: 1.3;
}
.meta {
  color: var(--mut);
  font-size: 13px;
  margin: 0;
}
.meta.d {
  color: var(--tx);
  font-weight: 600;
}
.cd {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  background: var(--rose-t);
  color: var(--ser-k);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  width: fit-content;
}
.cd.few {
  background: #fff3dc;
  color: #8a4a00;
}
.cd.sold {
  background: #fbe3e2;
  color: #9b3a38;
  font-weight: 700;
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: auto;
  padding-top: 8px;
}
.actions .btn {
  flex: 1;
  font-size: 13px;
  padding: 10px 12px;
}
.empty {
  color: var(--mut);
  border: 1.5px dashed var(--bd);
  border-radius: 10px;
  padding: 32px;
  text-align: center;
  background: var(--w);
}
form,
.panel {
  background: var(--w);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 24px;
  max-width: 560px;
}
#authf,
#pform {
  background: none;
  border: 0;
  padding: 0;
  max-width: none;
}
label.f {
  display: block;
  font-weight: 600;
  font-size: 13px;
  margin: 0 0 6px;
  color: var(--tx);
}
.fld {
  margin-bottom: 20px;
}
input[type="text"],
input[type="email"],
input[type="tel"],
input[type="password"],
input[type="number"],
select {
  width: 100%;
  background: var(--w);
  color: var(--tx);
  border: 1.5px solid var(--bd);
  border-radius: 8px;
  padding: 11px 14px;
  outline: 0;
}
input:focus,
select:focus {
  border-color: var(--ser-d);
  box-shadow: 0 0 0 3px rgba(91, 115, 168, 0.2);
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  position: relative;
}
.chip input {
  position: absolute;
  opacity: 0;
  inset: 0;
  cursor: pointer;
}
.chip span {
  display: block;
  padding: 8px 14px;
  border: 1.5px solid var(--bd);
  border-radius: 8px;
  font-size: 13px;
}
.chip input:checked + span {
  background: var(--rose-t);
  border-color: var(--ser-d);
  color: var(--ser-k);
  font-weight: 700;
}
.chip input:focus-visible + span {
  outline: 2px solid var(--ser-d);
  outline-offset: 2px;
}
.chk {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
  cursor: pointer;
  color: var(--tx);
}
.chk input {
  width: 18px;
  height: 18px;
  accent-color: var(--ser-d);
}
.tabs {
  display: flex;
  gap: 6px;
  background: var(--bg);
  border-radius: 8px;
  padding: 4px;
  margin-bottom: 20px;
}
.tabs button {
  flex: 1;
  border: 0;
  background: none;
  border-radius: 6px;
  padding: 8px;
  cursor: pointer;
  font-weight: 600;
  color: var(--body);
}
.tabs button.on {
  background: var(--ser-d);
  color: var(--w);
}
.err {
  background: var(--rose-t);
  border: 1.5px solid var(--rose);
  border-top: 3px solid var(--acc);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--tx);
  font-size: 13px;
  margin: 0 0 16px;
}
.tablewrap {
  overflow-x: auto;
  margin-bottom: 28px;
  background: var(--w);
  border: 1px solid var(--bd);
  border-radius: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 620px;
}
th,
td {
  text-align: left;
  padding: 14px 16px;
  border-bottom: 1px solid var(--bd);
}
tbody tr:last-child td {
  border-bottom: 0;
}
th {
  color: var(--mut);
  font-weight: 700;
  font-size: 12px;
  background: var(--bg);
}
td {
  color: var(--tx);
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  background: var(--rose);
  color: var(--ser-k);
}
.tag.v {
  background: var(--bg);
  border: 1px solid var(--bd);
  color: var(--tx);
}
.tag.ver {
  background: #e4ebf7;
}
.tag.sold {
  background: #fbe3e2;
  color: #9b3a38;
}
.tag.few {
  background: #ffe7bf;
  color: #8a4a00;
}
.okmsg {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 8px;
  background: #e4ebf7;
  color: var(--ser-k);
  border: 1px solid var(--ser);
  font-weight: 600;
  font-size: 14px;
}
.bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  align-items: center;
}
.bar select {
  width: auto;
  min-width: 170px;
  max-width: 100%;
}
.price {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.price s {
  color: var(--mut);
  font-size: 13px;
}
.price b {
  font-size: 22px;
  color: var(--ser-k);
}
.rowtop {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(42, 51, 80, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 20;
}
.modal.on {
  display: flex;
}
.box {
  background: var(--w);
  border-radius: 12px;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 12px 40px rgba(42, 51, 80, 0.3);
  animation: pop 0.25s ease;
}
@keyframes pop {
  from {
    transform: scale(0.96);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.box h3 {
  margin: 0 0 10px;
  font-size: 20px;
  line-height: 1.3;
}
.box p {
  margin: 0 0 18px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  background: var(--tx);
  color: var(--w);
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
  z-index: 30;
  max-width: 90vw;
}
.toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}
.av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  background: var(--rose);
  color: var(--ser-k);
}
.un {
  font-weight: 600;
  color: var(--tx);
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user {
  display: flex;
  gap: 10px;
  align-items: center;
}
footer {
  background: var(--ser-k);
  color: #e6e9f5;
  margin-top: 24px;
}
.fgrid {
  max-width: 1040px;
  margin: 0 auto;
  padding: 44px 24px 28px;
  display: grid;
  grid-template-columns: 1.3fr 1fr 1.5fr;
  gap: 36px;
}
@media (max-width: 860px) {
  .fgrid {
    grid-template-columns: 1fr;
    gap: 28px;
  }
}
footer .logo {
  color: var(--w);
  margin-bottom: 12px;
}
footer .logo i {
  color: var(--rose);
}
footer h4 {
  margin: 0 0 14px;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rose);
  font-weight: 700;
}
footer p {
  margin: 0 0 12px;
  font-size: 14px;
}
footer a,
.fl {
  color: #e6e9f5;
  text-decoration: none;
  font-size: 14px;
}
footer a:hover,
.fl:hover {
  color: var(--w);
  text-decoration: underline;
}
.fl {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
.fcols {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 24px;
}
@media (max-width: 520px) {
  .fcols {
    grid-template-columns: 1fr;
  }
}
.flist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.socs {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
.soc {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  background: none;
  color: var(--w);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: 0.2s;
}
.soc:hover {
  background: var(--rose);
  color: var(--ser-k);
  border-color: var(--rose);
}
.ssl {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  border: 1px solid rgba(247, 202, 201, 0.5);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--w);
  line-height: 1.4;
}
.fbar {
  border-top: 1px solid rgba(255, 255, 255, 0.15);
}
.fbar > div {
  max-width: 1040px;
  margin: 0 auto;
  padding: 16px 24px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: space-between;
  gap: 8px 24px;
  flex-wrap: wrap;
  font-size: 13px;
  align-items: center;
}
.flinks {
  display: flex;
  gap: 6px 12px;
  flex-wrap: wrap;
  align-items: center;
}
.flinks .fl {
  font-size: 13px;
}
.thumb {
  height: 150px;
  position: relative;
  background-size: cover;
  background-position: center;
}
.tk {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: var(--w);
  color: var(--ser-k);
  font-weight: 700;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 6px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}
.ph {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(42, 51, 80, 0.78);
  color: var(--w);
  padding: 3px 10px;
  border-radius: 99px;
}
.sellgrid {
  display: grid;
  grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
@media (max-width: 900px) {
  .sellgrid {
    grid-template-columns: 1fr;
  }
}
.panel ul,
.panel ol {
  padding-left: 20px;
  margin: 0 0 18px;
  color: var(--tx);
}
.panel li {
  margin-bottom: 8px;
  font-size: 14px;
}
.panel h3 {
  margin: 0 0 10px;
  font-size: 16px;
}
input[type="file"] {
  width: 100%;
  font-size: 13px;
}
#pb ul {
  padding-left: 20px;
  margin: 0 0 14px;
  color: var(--tx);
}
#pb li {
  margin-bottom: 8px;
}
#pb h4 {
  margin: 18px 0 6px;
  color: var(--ser-k);
  font-size: 15px;
}
#pb p {
  margin: 0 0 10px;
  color: var(--tx);

const resolveEv = (v, pool) => {
  const q = norm(v.trim());
  if (!q) return null;
  const ex = pool.find((e) => norm(e.name) === q);
  if (ex) return ex;
  const m = pool.filter((e) => norm(e.name + e.artist).includes(q));
  return m.length === 1 ? m[0] : null;
};

function route() {

    "blog",

const parts = (d) => {

  return [

    Math.floor((s % 86400) / 3600),
    Math.floor((s % 3600) / 60),
  ];
};

async function hashCode(x) {
  try {
    const b = await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(x),
    );
    return [...new Uint8Array(b)]
      .map((v) => v.toString(16).padStart(2, "0"))
      .join("");
  } catch (e) {
    let h = 5381;
    for (const c of x) h = (h * 33) ^ c.charCodeAt(0);
    return "d" + (h >>> 0).toString(16);
  }
}
function readImg(f, S, q) {
  return new Promise((res) => {
    if (!f || !f.type.startsWith("image/")) return res("");
    const r = new FileReader();
    r.onerror = () => res("");
    r.onload = () => {
      const i = new Image();
      i.onerror = () => res("");
      i.onload = () => {
        const k = Math.min(1, S / i.width),
          c = document.createElement("canvas");
        c.width = Math.round(i.width * k);
        c.height = Math.round(i.height * k);
        c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      i.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

let payCtx = null;

  const c = payCtx,

}

    const oid = "TM" + String(Date.now()).slice(-7);

function startBuy(id) {
  requireLogin(() => {
    const l = allListings().find((x) => x.id === id);
    if (!l) return;
    const e = ev(l.ev),
      q = qtyOf(l);
    openPay({
      title: t("buyB"),
      lines: [[`${e.name} · ${l.tier} × ${q}`, l.ask * q]],
      base: l.ask * q,
      voucher: isPlus(),
      escrow: true,
      onPaid: (o) => {
        state.orders.unshift({
          id: o.oid,
          lid: l.id,
          ev: l.ev,
          tier: l.tier,
          q,
          tot: o.tot,
          bank: o.bank,
          ts: Date.now(),
        });
        store.set("tm_orders", state.orders);
        renderListings();
        renderAccount();
      },
    });
  });
}

let chatId = null;
function drawChat() {
  const th = state.chats[chatId] || [];
  $("#chatlog").innerHTML = th.length
    ? th
        .map(
          (m) =>
            `<div class="msg ${m.me ? "me" : ""}"><small>${t(m.me ? "chatMe" : "chatSeller")}</small>${esc(m.x)}</div>`,
        )
        .join("")
    : `<p class="hint">${t("chatEmpty")}</p>`;
  $("#chatlog").scrollTop = 1e9;
}
function openChat(id) {
  requireLogin(() => {
    const l = anyL(id);
    if (!l) return;
    if (l.owner && l.owner === state.user.key) {
      toast(t("chatOwn"));
      return;
    }
    chatId = id;
    $("#chatwho").textContent = `#${l.id} · ${ev(l.ev).name} · ${l.tier}`;
    $("#chaterr").hidden = true;
    $("#chatin").value = "";
    drawChat();
    openModal("#m6");
  });
}
$("#chatf").addEventListener("submit", (e) => {
  e.preventDefault();
  const x = $("#chatin").value.trim();
  if (!x) return;
  if (/\d[\d\s.-]{7,}\d/.test(x)) {
    $("#chaterr").hidden = false;
    $("#chaterr").textContent = t("chatErr");
    return;
  }
  $("#chaterr").hidden = true;
  const id = chatId,
    th = (state.chats[id] = state.chats[id] || []);
  th.push({ me: 1, x, ts: Date.now() });
  store.set("tm_chats", state.chats);
  $("#chatin").value = "";
  drawChat();
  if (!th.some((m) => !m.me))
    setTimeout(() => {
      th.push({ me: 0, x: t("chatBot"), ts: Date.now() });
      store.set("tm_chats", state.chats);
      if (chatId === id) drawChat();
    }, 900);
});
